<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ghost Companion — UI案 3つ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0; min-height: 100dvh;
      font-family: "Zen Kaku Gothic New", sans-serif;
      color: #2a3350;
      background: linear-gradient(160deg, #eef3f9, #f7f8fb 60%, #e8eef6);
      padding: 40px 20px 60px;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.75rem; margin: 0 0 8px; letter-spacing: 0.04em; }
    p { margin: 0 0 28px; opacity: 0.7; line-height: 1.6; }
    ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
    a {
      display: block; text-decoration: none; color: inherit;
      padding: 18px 20px; border-radius: 18px;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 10px 28px rgba(42,51,80,0.06);
      border: 1px solid rgba(42,51,80,0.06);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(42,51,80,0.1); }
    strong { display: block; font-size: 1.15rem; margin-bottom: 4px; color: #e56b8c; }
    span { font-size: 0.92rem; opacity: 0.75; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Ghost Companion UI 案</h1>
    <p>3方向。ブラウザで開いて見比べてください。</p>
    <ol>
      <li>
        <a href="./a-plaza.html">
          <strong>案A — ひろばデスク</strong>
          <span>明るい紙の場。ブランド大＋お化け＋「いまの調子を話す」一本。会話は下に短く。</span>
        </a>
      </li>
      <li>
        <a href="./b-sticky.html">
          <strong>案B — 透けスティッキー</strong>
          <span>デスクトップに貼る想定。コンパクトなお化けと、すりガラスの会話シート。</span>
        </a>
      </li>
      <li>
        <a href="./c-voice.html">
          <strong>案C — こえの場</strong>
          <span>夜霧の声優先。ウェイクワードと波形が主役。大きな一本ボタン。</span>
        </a>
      </li>
    </ol>
  </main>
</body>
</html>
